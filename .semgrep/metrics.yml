rules:
  - id: metrics-no-per-call-attribute-set
    languages: [go]
    severity: ERROR
    message: >
      Build the attribute set once and look it up, do not construct one per
      recording call. attribute.NewSet sorts and allocates every time (measured
      264ns/192B against 9.6ns/0B for a map lookup), and recording paths run
      per message, per recipient or per failed item — the "cold path" argument
      fails exactly when the incident you are measuring is happening. Precompute
      the closed label combinations into a map keyed by your enum, the way
      pkg/natsmetrics and search-sync-worker/metrics.go do.
    paths:
      exclude:
        - "**/*_test.go"
        # data-migration/oplog-* are one-shot batch tools, not always-on
        # services: they are run under supervision for a migration window and
        # their metrics are read live during that window. The allocation
        # argument is about sustained production load, which they never carry.
        #
        # Leading slash anchors this to the repo-root directory, which is the
        # only one that exists. Semgrepignore v2 will read an unanchored
        # "data-migration/**" as anchored anyway and warns about the ambiguity,
        # so say which one is meant.
        - "/data-migration/**"
    patterns:
      - pattern-either:
          - pattern: $C.Add($CTX, $N, metric.WithAttributes(...))
          - pattern: $C.Add($CTX, $N, metric.WithAttributeSet(attribute.NewSet(...)))
          - pattern: $C.Record($CTX, $V, metric.WithAttributes(...))
          - pattern: $C.Record($CTX, $V, metric.WithAttributeSet(attribute.NewSet(...)))

  - id: metrics-no-unbounded-label
    languages: [go]
    severity: ERROR
    message: >
      This identifier is unbounded — one metric series per room, account, user,
      message or subject will grow without limit and take the metrics backend
      with it. Identity belongs on the log line and the span next to the call,
      where high cardinality is free. If you need to slice the metric, add a
      closed enum instead (see bulkStatusLabel in search-sync-worker, or the
      label enums in pkg/natsmetrics).
    paths:
      exclude:
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - pattern: metric.WithAttributes(..., attribute.String("$KEY", $V), ...)
          - pattern: attribute.NewSet(..., attribute.String("$KEY", $V), ...)
      - metavariable-regex:
          metavariable: $KEY
          # Three shapes, all drawn from the contract's forbidden-label list:
          #
          #   1. An identity prefix with an optional Id / _id / UID / _uid tail.
          #      The tail is optional because attribute.String("room", roomID) is
          #      the same one-series-per-room growth as ("roomId", roomID), and
          #      the bare key slipped past the earlier form of this rule.
          #   2. Anything ending in Subject or _subject — the contract forbids
          #      both "inbox subject" and "arbitrary destination subject", and
          #      the key is usually qualified (inboxSubject, destSubject).
          #   3. index, which is an Elasticsearch index name.
          #
          # run is here for run_id specifically. A bounded run_info metric
          # describing scenario and traffic profile is allowed by the contract
          # and does not match, because run_info is not run + an id tail.
          regex: ^(?:(?:room|account|user|message|request|trace|doc|span|session|device|tenant|org|run|recipient|inbox|pod)(?:_?[uU]?[iI][dD])?|[a-z]*_?[sS]ubject|index)$
