rules:
  - id: rpcmethod-must-be-a-vocabulary-constant
    languages: [go]
    severity: ERROR
    message: >
      Pass a natsmetrics.Method* constant, not a string literal, as the rpc
      method argument. RPCMethod is a named string type, so a typed constant
      cannot be transposed with the pattern argument — the compiler already
      refuses that — but an untyped string constant is assignable to both
      string and RPCMethod, so a plain literal here compiles and silently
      degrades to rpc_method="_OTHER" at runtime instead of failing the
      build. If the route needs a method that doesn't exist yet, add it to
      pkg/natsmetrics/rpcmethod.go — its rpcMethods list is the single
      source of truth, and the naming guards in rpcmethod_test.go run over
      it.
    paths:
      exclude:
        - "**/*_test.go"
    # RegisterVoid takes no method argument, so it needs no pattern here —
    # there is no method position to check.
    #
    # Each of the three method-bearing registrars gets two branches: the
    # inferred-type-arguments call natsrouter.Register(r, pattern, method,
    # fn), which is how most call sites read, and the explicit form
    # natsrouter.Register[Req, Resp](...), which bot-message-handler and
    # bot-room-service use because Go can't infer Req from a nil handler
    # literal in some call shapes. Explicit type arguments sit between the
    # function name and the call parens, a different AST shape than the
    # plain call — a pattern for one does not match the other, so dropping
    # either branch reopens the hole on exactly the call sites that use it.
    #
    # "..." inside the quoted position matches any string literal, not just
    # empty strings — semgrep's literal-string wildcard. A
    # natsmetrics.Method* selector, or an explicit natsmetrics.RPCMethod(...)
    # conversion, is a different expression shape and does not match.
    pattern-either:
      - pattern: natsrouter.Register($R, $PATTERN, "...", $FN)
      - pattern: natsrouter.Register[...]($R, $PATTERN, "...", $FN)
      - pattern: natsrouter.RegisterNoBody($R, $PATTERN, "...", $FN)
      - pattern: natsrouter.RegisterNoBody[...]($R, $PATTERN, "...", $FN)
      - pattern: natsrouter.RegisterOptionalBody($R, $PATTERN, "...", $FN)
      - pattern: natsrouter.RegisterOptionalBody[...]($R, $PATTERN, "...", $FN)
