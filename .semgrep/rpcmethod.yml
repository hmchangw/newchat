rules:
  - id: rpcmethod-server-route-must-name-a-vocabulary-constant
    languages: [go]
    severity: ERROR
    message: >
      Pass a natsmetrics.Method* constant directly as the rpc method argument
      — of a natsrouter server route registration, or of a
      Publisher.RecordRPCClientCall on the outbound lane. Anything else — a string
      literal, an explicit natsmetrics.RPCMethod(...) conversion, or a
      variable, even one holding a legitimate constant — is rejected here.

      RPCMethod is a named string type, so a typed constant cannot be
      transposed with the pattern argument; the compiler already refuses
      that. What the compiler does not refuse is an untyped string constant
      (assignable to both string and RPCMethod), a conversion of an arbitrary
      string, or an indirection through a variable. All three compile and
      then degrade to rpc_method="_OTHER" at runtime instead of failing the
      build. A variable is refused rather than resolved because this rule
      matches syntax, not values: it cannot tell a variable holding
      MethodOpenRoom from one holding a typo, and a rule that accepted the
      shape would accept both.

      natsmetrics.MethodOther is refused too. It is the record-time fallback
      for a value that should never occur, not a method a route may claim.

      If the route needs a method that does not exist yet, add it to
      pkg/natsmetrics/rpcmethod.go — its rpcMethods list is the single source
      of truth, and the naming guards in rpcmethod_test.go run over it.
    paths:
      exclude:
        - "**/*_test.go"
    # SCOPE: both lanes' method arguments, and nothing else.
    #
    # Server lane: natsrouter's three method-bearing registrars.
    #
    # Client lane: Publisher.RecordRPCClientCall, which records
    # rpc.client.call.duration and takes the same RPCMethod. An earlier version
    # of this rule claimed the outbound lane had "no rpc.client instrument yet,
    # so no method argument to constrain". That was wrong — it IS the recorder,
    # and call sites were already passing it a method while the claim stood,
    # carrying exactly the hole this rule closes on the server side.
    #
    # The rule covers every currently instrumented outbound call site. No count
    # is written here on purpose: the previous one said six, was accurate for
    # about a day, and then quietly was not. `git grep -c "\.RecordRPCClientCall("`
    # answers it, and cannot go stale.
    #
    # Still NOT covered: search-service/room_client.go, the one raw nc.Request
    # call site that records no client metric at all. A rule cannot constrain
    # an argument that is not passed. Read a passing scan as "every method
    # argument that is passed names a constant directly", not as "every
    # outbound call is measured".
    #
    # Each registrar gets two branches: the inferred-type-arguments call
    # natsrouter.Register(r, pattern, method, fn), which is how most call
    # sites read, and the explicit form natsrouter.Register[Req, Resp](...),
    # which bot-message-handler and bot-room-service use because Go can't
    # infer Req from a nil handler literal in some call shapes. Explicit type
    # arguments sit between the function name and the call parens, a different
    # AST shape than the plain call — a pattern for one does not match the
    # other, so dropping either branch reopens the hole on exactly the call
    # sites that use it.
    #
    # The allowlist is expressed as a negative lookahead over the method
    # metavariable's source text, so the rule fires on everything that is not
    # a direct natsmetrics.Method* selector. Written the other way round — as
    # a denylist of known-bad shapes — every shape nobody thought of is
    # admitted by default, which is how the earlier literal-only version let
    # natsmetrics.RPCMethod("typo") through.
    #
    # (?!Other$) carves MethodOther back out of the allowlist while leaving a
    # hypothetical MethodOtherThing in it.
    #
    # The regex deliberately ends after the lookahead. metavariable-regex is a
    # start-anchored re.match, so no trailing ".*$" is needed — and adding one
    # silently reopens the hole: Python re leaves "." not matching "\n" and "$"
    # anchored to end-of-string, so any method argument whose source text spans
    # lines (a gofmt-wrapped RPCMethod(...) conversion, a split string concat)
    # failed the ".*$" and the rule did not fire. The fixture covers both
    # multi-line spellings so a re-added anchor fails the rule tests.
    #
    # An aliased or dot-imported natsmetrics is flagged rather than allowed:
    # the qualifier is spelled literally here, so nm.MethodOpenRoom is a false
    # positive. That fails closed, which is the safe direction; this repo does
    # not alias the import.
    patterns:
      - pattern-either:
          - pattern: natsrouter.Register($R, $PATTERN, $METHOD, $FN)
          - pattern: natsrouter.Register[...]($R, $PATTERN, $METHOD, $FN)
          - pattern: natsrouter.RegisterNoBody($R, $PATTERN, $METHOD, $FN)
          - pattern: natsrouter.RegisterNoBody[...]($R, $PATTERN, $METHOD, $FN)
          - pattern: natsrouter.RegisterOptionalBody($R, $PATTERN, $METHOD, $FN)
          - pattern: natsrouter.RegisterOptionalBody[...]($R, $PATTERN, $METHOD, $FN)
          # Client lane. One branch, and it needs no receiver or duration
          # heuristic: RecordRPCClientCall is a name nothing else in the tree
          # has, so matching it is unambiguous however the publisher is stored
          # and however the duration is computed.
          #
          # This is why the method was renamed. As Publisher.Request it
          # collided with nats.Conn.Request(ctx, subject, payload, timeout) —
          # same arity, same first argument, unrelated meaning — so a bare
          # $P.Request(...) produced 26 false positives on ordinary outbound
          # calls. Working around that meant guessing: one branch on the
          # `metrics` field name, one on an inline time.Since, one on an
          # explicit RPCMethod conversion. A publisher under any other field
          # name, timed any other way, given a literal, escaped all three.
          # Renaming the recorder deleted the ambiguity instead of covering
          # for it.
          - pattern: $P.RecordRPCClientCall($CTX, $METHOD, $DUR, $ERR)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(?!natsmetrics\.Method(?!Other$)[A-Z])
