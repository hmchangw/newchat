name: broadcast-worker

services:
  broadcast-worker:
    build:
      context: ../../..
      dockerfile: broadcast-worker/deploy/user/Dockerfile
    environment:
      - OTEL_SERVICE_NAME=broadcast-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - SITE_ID=${SITE_ID:-site-local}
      - ALL_SITE_IDS=${ALL_SITE_IDS:-${SITE_ID:-site-local}}
      # Same-site rooms (crossSite:false) are subscribed by the client on
      # chat.local.room.>; publishing global-only would never reach it.
      - ROOM_SUBJECT_MODE=${ROOM_SUBJECT_MODE:-dual}
      - THREAD_VIEW_SUBJECT_ENABLED=${THREAD_VIEW_SUBJECT_ENABLED:-true}
      - MODE=user
      # Dev-only pprof profiling on the health port (off by default). Flip on
      # stack-wide for a profiling session with `PPROF_ENABLED=true make up`.
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
      # In-process user cache (pkg/userstore.Cache, shared with message-gatekeeper
      # and message-worker). Defaults: 10000 entries, 5m TTL.
      - USER_CACHE_SIZE=${USER_CACHE_SIZE:-10000}
      - USER_CACHE_TTL=${USER_CACHE_TTL:-5m}
      - USER_L2_TTL=${USER_L2_TTL:-90m}
      # Room keys live in the MongoDB rooms collection (read when ENCRYPTION_ENABLED=true);
      # this grace window keeps a rotated-out previous key valid for decrypt.
      - ROOM_KEY_GRACE_PERIOD=${ROOM_KEY_GRACE_PERIOD:-24h}
      - ROOM_KEY_RETIRED_TTL=${ROOM_KEY_RETIRED_TTL:-20m}
      # Valkey backs the room-meta L2 cache.
      - VALKEY_ADDRS=${VALKEY_ADDRS:-valkey:6379}
      - ROOM_META_L2_TTL=${ROOM_META_L2_TTL:-90m}
      - ROOMSUBCACHE_TTL=${ROOMSUBCACHE_TTL:-90m}
      # Retry budget for the message fan-out. The service already defaults to
      # stream.OutageRetryMaxDeliver in code (compose is dev-only, so a budget set
      # here would be absent in production); this is here to tune it locally.
      - CONSUMER_MAX_DELIVER=${CONSUMER_MAX_DELIVER:-40}
      - BOOTSTRAP_STREAMS=${BOOTSTRAP_STREAMS:-true}
      - ENCRYPTION_ENABLED=${ENCRYPTION_ENABLED:-false}
      # Dev-only X-Debug verbose logging. DEBUG_LOG_PAYLOADS gates full
      # request/reply/consumed body capture (pair with the X-Debug-Payload header).
      - DEBUG_LOG_PAYLOADS=${DEBUG_LOG_PAYLOADS:-false}
      - DEBUG_LOG_RATE=${DEBUG_LOG_RATE:-50}
    volumes:
      - ../../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
