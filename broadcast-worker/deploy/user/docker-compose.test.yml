services:
  nats_site1:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../test/nats/nats-site1.conf:/etc/nats/nats.conf:ro
    ports:
      - "4222:4222"
      - "8222:8222"

  nats_site2:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../test/nats/nats-site2.conf:/etc/nats/nats.conf:ro
    ports:
      - "4223:4222"
      - "8223:8222"

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"

  broadcast-worker:
    build:
      context: ../../..
      dockerfile: broadcast-worker/deploy/user/Dockerfile
    environment:
      - NATS_URL=nats://nats_site1:4222
      - SITE_ID=site1
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=chat
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
      - INPUT_STREAM=MESSAGES-CANONICAL-site1
      - INPUT_SUBJECT_FILTER=chat.msg.canonical.site1.*
      # No ATREST_ENABLED here, unlike deploy/{user,bot}/docker-compose.yml: this
      # harness runs no Vault, and the worker exits on startup if it cannot reach one.
      # Previews are therefore off for these scenarios, which is what we want — they
      # exercise cross-site delivery, not preview persistence.
    depends_on:
      - nats_site1
      - mongodb

  tools:
    image: natsio/nats-box:latest
    command: ["sleep", "infinity"]
    depends_on:
      - nats_site1
      - nats_site2
