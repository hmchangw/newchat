name: portal-service

services:
  # The directory is chat.users left-joined with chat.hr_employee; `make seed`
  # owns both collections.
  portal-service:
    build:
      context: ../..
      dockerfile: portal-service/deploy/Dockerfile
    pull_policy: build
    ports:
      - "${PORTAL_SERVICE_HOST_PORT:-8085}:8085"
    env_file:
      - path: ../../docker-local/.env
        required: false
    environment:
      - OTEL_SERVICE_NAME=portal-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - PORT=8085
      # Dev fallback: accounts absent from the directory resolve to the local site.
      - DEV_MODE=${DEV_MODE:-true}
      - PORTAL_DEV_FALLBACK_SITE_ID=${PORTAL_DEV_FALLBACK_SITE_ID:-${SITE_ID:-site-local}}
      - PORTAL_DEV_FALLBACK_NATS_URL=${PORTAL_DEV_FALLBACK_NATS_URL:-ws://localhost:9222}
      # Per-site URL registry (JSON): siteId -> {baseUrl, natsUrl} (see siteURL
      # in handler.go — both required, nothing else read). baseUrl is the unified
      # backend origin (`{baseUrl}/api/v1/...` via the Traefik gateway on :7777);
      # natsUrl is the site's NATS WS URL.
      # site-remote maps to the same local endpoints: `make seed` homes ivan and
      # judy there, and an unregistered site is a 500 on /api/userInfo. _backup
      # is the reserved failover backup entry (SP3), same local stack in dev.
      - 'PORTAL_SITE_URLS=${PORTAL_SITE_URLS:-{"${SITE_ID:-site-local}":{"baseUrl":"http://localhost:${GATEWAY_HOST_PORT:-7777}","natsUrl":"ws://localhost:9222"},"site-remote":{"baseUrl":"http://localhost:${GATEWAY_HOST_PORT:-7777}","natsUrl":"ws://localhost:9222"},"_backup":{"baseUrl":"http://localhost:${GATEWAY_HOST_PORT:-7777}","natsUrl":"ws://localhost:9222"}}}'
      # 1m, not the 2h prod default, so `make seed` lands without a restart.
      - PORTAL_CACHE_REFRESH_INTERVAL=${PORTAL_CACHE_REFRESH_INTERVAL:-1m}
      # Single cluster-internal botplatform endpoint /api/v1/login forwards to.
      - BOTPLATFORM_URL=${BOTPLATFORM_URL:-http://botplatform-service:8080}
      # Served to the frontend via GET /api/settings. Both required (notEmpty) —
      # the localhost OTEL URL is a dev placeholder; real value set per-deployment.
      - PORTAL_API_VERSION=${PORTAL_API_VERSION:-v2}
      - PORTAL_OTEL_BASE_URL=${PORTAL_OTEL_BASE_URL:-http://localhost:4318/v1}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
      # Operator failover control surface (SP4). Empty by default — matching
      # main.go's safe default, the control surface stays off until an operator
      # supplies a token. Set FAILOVER_OPS_TOKEN in the env to exercise it
      # locally; it binds an internal-only listener, off the public :8085 API.
      - FAILOVER_OPS_TOKEN=${FAILOVER_OPS_TOKEN:-}
      - FAILOVER_INTERNAL_ADDR=${FAILOVER_INTERNAL_ADDR:-:8090}
      # Reserved backup entry served for a failed-over site (SP3).
      - PORTAL_BACKUP_SITE_ID=${PORTAL_BACKUP_SITE_ID:-_backup}
    networks:
      - chat-local

networks:
  chat-local:
    external: true
