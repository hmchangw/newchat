name: portal-service

services:
  # The directory portal serves is chat.users left-joined with chat.hr_employee.
  # Both collections are seeded by `make seed` (tools/seed-sample-data) — run it
  # once after `make deps-up`, and again whenever you want the fixtures back.
  portal-service:
    build:
      context: ../..
      dockerfile: portal-service/deploy/Dockerfile
    pull_policy: build
    ports:
      - "8085:8085"
    env_file:
      - path: ../../docker-local/.env
        required: false
    environment:
      - OTEL_SERVICE_NAME=portal-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - PORT=8085
      # Dev fallback: accounts absent from the directory resolve to the local site.
      - DEV_MODE=${DEV_MODE:-true}
      - PORTAL_DEV_FALLBACK_SITE_ID=site-local
      - PORTAL_DEV_FALLBACK_NATS_URL=ws://localhost:9222
      # Per-site URL registry (JSON): siteId -> {baseUrl, natsUrl} (see siteURL
      # in handler.go — both required, nothing else read). baseUrl is the unified
      # backend origin (`{baseUrl}/api/v1/...` via the Traefik gateway on :7777);
      # natsUrl is the site's NATS WS URL.
      #
      # site-remote points at the same local endpoints on purpose. `make seed`
      # homes ivan and judy on site-remote to exercise cross-site data, but local
      # dev runs a single site — without an entry here, resolving either account
      # is an ops misconfiguration to portal and /api/userInfo answers 500.
      - 'PORTAL_SITE_URLS={"site-local":{"baseUrl":"http://localhost:7777","natsUrl":"ws://localhost:9222"},"site-remote":{"baseUrl":"http://localhost:7777","natsUrl":"ws://localhost:9222"}}'
      # Local dev re-reads the directory every minute (prod default is 2h) so a
      # `make seed` run after the stack is already up shows up in /api/userInfo
      # without a portal restart.
      - PORTAL_CACHE_REFRESH_INTERVAL=1m
      # Single cluster-internal botplatform endpoint /api/v1/login forwards to.
      - BOTPLATFORM_URL=http://botplatform-service:8080
      # Served to the frontend via GET /api/settings. Both required (notEmpty) —
      # the localhost OTEL URL is a dev placeholder; real value set per-deployment.
      - PORTAL_API_VERSION=v2
      - PORTAL_OTEL_BASE_URL=http://localhost:4318/v1
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=chat
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
    networks:
      - chat-local

networks:
  chat-local:
    external: true
