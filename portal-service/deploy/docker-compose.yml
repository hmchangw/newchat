name: portal-service

services:
  # The directory is chat.users left-joined with chat.hr_employee; `make seed`
  # owns both collections.
  portal-service:
    build:
      context: ../..
      dockerfile: portal-service/deploy/Dockerfile
    pull_policy: build
    ports:
      - "8085:8085"
    env_file:
      - path: ../../docker-local/.env
        required: false
    environment:
      - OTEL_SERVICE_NAME=portal-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - PORT=8085
      # Dev fallback: accounts absent from the directory resolve to the local site.
      - DEV_MODE=${DEV_MODE:-true}
      - PORTAL_DEV_FALLBACK_SITE_ID=${SITE_ID:-site-local}
      - PORTAL_DEV_FALLBACK_NATS_URL=ws://localhost:9222
      # Per-site URL registry (JSON): siteId -> {baseUrl, natsUrl} (see siteURL
      # in handler.go — both required, nothing else read). baseUrl is the unified
      # backend origin (`{baseUrl}/api/v1/...` via the Traefik gateway on :7777);
      # natsUrl is the site's NATS WS URL.
      # site-remote maps to the same local endpoints: `make seed` homes ivan and
      # judy there, and an unregistered site is a 500 on /api/userInfo.
      - 'PORTAL_SITE_URLS={"${SITE_ID:-site-local}":{"baseUrl":"http://localhost:7777","natsUrl":"ws://localhost:9222"},"site-remote":{"baseUrl":"http://localhost:7777","natsUrl":"ws://localhost:9222"}}'
      # 1m, not the 2h prod default, so `make seed` lands without a restart.
      - PORTAL_CACHE_REFRESH_INTERVAL=1m
      # Single cluster-internal botplatform endpoint /api/v1/login forwards to.
      - BOTPLATFORM_URL=http://botplatform-service:8080
      # Served to the frontend via GET /api/settings. Both required (notEmpty) —
      # the localhost OTEL URL is a dev placeholder; real value set per-deployment.
      - PORTAL_API_VERSION=v2
      - PORTAL_OTEL_BASE_URL=http://localhost:4318/v1
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
    networks:
      - chat-local

networks:
  chat-local:
    external: true
