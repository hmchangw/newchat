name: teams-room-inspector

services:
  teams-room-inspector:
    build:
      context: ../..
      dockerfile: teams-room-inspector/deploy/Dockerfile
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      - SITE_ID=${SITE_ID:-site-local}
      - PORT=${PORT:-8080}
    ports:
      - "8080:8080"
    networks:
      - chat-local

networks:
  chat-local:
    external: true
