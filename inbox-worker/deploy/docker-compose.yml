name: inbox-worker

services:
  inbox-worker:
    build:
      context: ../..
      dockerfile: inbox-worker/deploy/Dockerfile
    environment:
      - OTEL_SERVICE_NAME=inbox-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - SITE_ID=${SITE_ID:-site-local}
      # Dev-only pprof profiling on the health port (off by default). Flip on
      # stack-wide for a profiling session with `PPROF_ENABLED=true make up`.
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      # Valkey cluster backing the badge cache; empty disables it.
      - VALKEY_ADDRS=${VALKEY_ADDRS:-valkey:6379}
      - BOOTSTRAP_STREAMS=${BOOTSTRAP_STREAMS:-true}
      # Dev points the buddy at the same NATS: one server, but the full failover
      # code path (stream create, consumer bind, dual-lane drain) still runs.
      # Placement is not asserted here — BOOTSTRAP_STREAMS=true takes the create
      # branch, and a single-server NATS reports no cluster at all.
      - BUDDY_SITE_ID=${BUDDY_SITE_ID:-site-local}
      - BUDDY_NATS_URL=${BUDDY_NATS_URL:-nats://nats:4222}
    volumes:
      - ../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
