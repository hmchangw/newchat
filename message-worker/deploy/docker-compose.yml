name: message-worker

services:
  message-worker:
    build:
      context: ../..
      dockerfile: message-worker/deploy/Dockerfile
    pull_policy: build
    environment:
      - OTEL_SERVICE_NAME=message-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - SITE_ID=${SITE_ID:-site-local}
      # Dev-only pprof profiling on the health port (off by default). Flip on
      # stack-wide for a profiling session with `PPROF_ENABLED=true make up`.
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - CASSANDRA_HOSTS=${CASSANDRA_HOSTS:-cassandra}
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-chat}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-primaryPreferred}
      # Shared Valkey cluster fronts the at-rest DEK L2 so the Cassandra write
      # path survives a Mongo outage. Empty disables the tier (fail-open).
      - VALKEY_ADDRS=${VALKEY_ADDRS:-valkey:6379}
      # In-process user cache (pkg/userstore.Cache, shared with message-gatekeeper
      # and broadcast-worker). Defaults: 10000 entries, 5m TTL.
      - USER_CACHE_SIZE=${USER_CACHE_SIZE:-10000}
      - USER_CACHE_TTL=${USER_CACHE_TTL:-5m}
      - USER_L2_TTL=${USER_L2_TTL:-90m}
      - BOOTSTRAP_STREAMS=${BOOTSTRAP_STREAMS:-true}
      # JetStream must never terminate a message behind the handler's back: the
      # give-up decision lives in settle.go, which drops only a request-class
      # Cassandra failure (invalid / syntax) that outlived the window below.
      - CONSUMER_MAX_DELIVER=${CONSUMER_MAX_DELIVER:--1}
      # How long a request-class failure is retried (accumulated NAK backoff)
      # before the message is destroyed. HISTORY_DROP_ENABLED=false is the brake.
      - INVALID_RETRY_WINDOW=${INVALID_RETRY_WINDOW:-1h}
      - HISTORY_DROP_ENABLED=${HISTORY_DROP_ENABLED:-true}
      # Unattended brake: caps destruction per pod per minute so a site-wide fault
      # that presents as a request error cannot destroy a whole feed unnoticed.
      - MAX_DROPS_PER_MINUTE=${MAX_DROPS_PER_MINUTE:-10}
      - ATREST_ENABLED=${ATREST_ENABLED:-true}
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-dev-only-token}
      - ATREST_VAULT_TRANSIT_KEY=${ATREST_VAULT_TRANSIT_KEY:-chat-kek}
      # Dev-only X-Debug verbose logging. DEBUG_LOG_PAYLOADS gates full
      # request/reply/consumed body capture (pair with the X-Debug-Payload header).
      - DEBUG_LOG_PAYLOADS=${DEBUG_LOG_PAYLOADS:-false}
      - DEBUG_LOG_RATE=${DEBUG_LOG_RATE:-50}
    volumes:
      - ../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
