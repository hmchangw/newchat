name: hr-sync-worker

# Long-running consumer persisting the HR feed. BOOTSTRAP_STREAMS=true here
# only — stream creation is ops-owned in production.
services:
  hr-sync-worker:
    build:
      context: ../..
      dockerfile: hr-sync-worker/deploy/Dockerfile
    restart: unless-stopped
    environment:
      - OTEL_SERVICE_NAME=hr-sync-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # One consumer per site: every site's worker drains every site's HR
      # stream, so an account created at one site reaches all of them.
      - SITE_IDS=${ALL_SITE_IDS:-site-local}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - MONGO_WRITE_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_WRITE_DB=${MONGO_DB:-chat}
      - BOOTSTRAP_STREAMS=${BOOTSTRAP_STREAMS:-true}
    volumes:
      - ../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
