name: user-service

services:
  user-service:
    build:
      context: ../..
      dockerfile: user-service/deploy/Dockerfile
    pull_policy: build
    environment:
      - OTEL_SERVICE_NAME=user-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - SITE_ID=${SITE_ID:-site-local}
      - ALL_SITE_IDS=${ALL_SITE_IDS:-${SITE_ID:-site-local}}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
      # Valkey cluster backing the badge cache; empty disables it.
      - VALKEY_ADDRS=${VALKEY_ADDRS:-valkey:6379}
      - BADGE_MARKER_TTL=${BADGE_MARKER_TTL:-10m}
      - MAX_SUBSCRIPTION_LIMIT=${MAX_SUBSCRIPTION_LIMIT:-1000}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-http://keycloak:8080/realms/chatapp}
      - OIDC_AUDIENCES=${OIDC_AUDIENCES:-nats-chat}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-nats-chat}
    volumes:
      - ../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
