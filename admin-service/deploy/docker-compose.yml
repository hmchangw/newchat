name: admin-service

services:
  admin-service:
    build:
      context: ../..
      dockerfile: admin-service/deploy/Dockerfile
    pull_policy: build
    ports:
      - "${ADMIN_SERVICE_HOST_PORT:-8082}:8082"
    environment:
      - OTEL_SERVICE_NAME=admin-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - PORT=8082
      - SITE_ID=${SITE_ID:-site-local}
      - ALL_SITE_IDS=${ALL_SITE_IDS:-${SITE_ID:-site-local}}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - ROOM_RPC_TIMEOUT=${ROOM_RPC_TIMEOUT:-5s}
      - FANOUT_TIMEOUT=${FANOUT_TIMEOUT:-30s}
      - BCRYPT_COST=${BCRYPT_COST:-10}
      - SESSIONS_MAX_PER_ACCOUNT=${SESSIONS_MAX_PER_ACCOUNT:-100}
      - CLIENT_UPDATE_URL=${CLIENT_UPDATE_URL:-http://client-update-service:8080}
      # Dev-only credential. Must match client-update-service's UPLOAD_TOKENS entry.
      - CLIENT_UPDATE_TOKEN=${CLIENT_UPDATE_TOKEN:-local-dev-token-0123456789}
      - CLIENT_UPDATE_UPLOAD_TIMEOUT=10m
    volumes:
      - ../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
