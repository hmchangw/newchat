apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-soak-loadgen-config
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: cassandra-soak
data:
  MONGO_DB: chat
  METRICS_ADDR: ":9099"
  MAX_IN_FLIGHT: "200"
  MESSAGE_BUCKET_HOURS: "72"
  SOAK_RUN_DURATION: 72h
  SOAK_WARMUP: 30s
  SOAK_SEND_RATE: "100"
  SOAK_READ_RATE: "700"
  SOAK_THREAD_SHARE: "0.10"
  SOAK_MUTATION_RATE: "5"
  SOAK_SOFT_DELETE_RATIO: "0.001"
  SOAK_REACTION_RATE: "100"
  SOAK_REACTIONS_PER_HOT_MESSAGE: "30"
  SOAK_REACTION_MESSAGE_SCOPE: hot_only
  SOAK_REACTION_REMOVE_SHARE: "0.20"
  SOAK_PINNED_LIST_RATE: "1"
  SOAK_VERIFY_RATE: "1"
  SOAK_MAX_USERS: "20000"
  SOAK_ACTIVE_USERS: "2000"
  SOAK_ROOM_COUNT: "10000"
  SOAK_CHANNEL_RATIO: "0.30"
  SOAK_CHANNEL_MEMBERS: "100"
  SOAK_RATE_SCOPE: site
  SOAK_MESSAGES_PER_ACTIVE_USER_PER_DAY: "0"
  SOAK_PAYLOAD_MEDIAN_BYTES: "1024"
  SOAK_PAYLOAD_P95_BYTES: "2048"
  SOAK_PAYLOAD_MAX_BYTES: "10240"
  SOAK_PERSIST_GRACE: 10s
  SOAK_MUTATION_RETRIES: "3"
  SOAK_RETRY_MIN_BACKOFF: 100ms
  SOAK_RETRY_MAX_BACKOFF: 5s
  SOAK_RECENT_PER_ROOM: "128"
  SOAK_RECENT_TOTAL: "200000"
