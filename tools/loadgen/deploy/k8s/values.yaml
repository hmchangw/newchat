# The release pipeline advances one run through:
# seed -> soak -> stopped -> teardown.
phase: stopped
runId: ""
siteId: ""

image:
  repository: ""
  digest: ""
  tag: ""
  pullPolicy: IfNotPresent
  # Local kind validation may opt in to a tag. Staging must use a digest.
  allowMutableTag: false

existingSecret: cassandra-soak-loadgen-secrets

mongo:
  database: chat

cassandra:
  keyspace: chat
  cleanup: none
  confirmKeyspace: ""
  messageBucketHours: 72

metrics:
  port: 9099
  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9099"

ledger:
  enabled: true
  # The run ID owns the seeded topology; the epoch owns the evidence journal.
  # Bump the epoch whenever a loadgen image changes the ledger contract, so a
  # fresh journal starts without re-seeding the room set.
  epoch: v1
  existingClaim: ""
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /var/lib/loadgen/ledger
  capacity: "200000"
  reconcileDeadline: 10m
  reconcileRetryInterval: 1s
  reconcileReadShare: 0.5
  roomReconcileReadShare: 0.5

recipientObserver:
  enabled: false
  queue: 8192
  connections: 32

seed:
  randomSeed: 42
  activeDeadlineSeconds: 7200
  backoffLimit: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
soak:
  # A Deployment must remain continuous. Use the CLI/Compose duration mode for
  # bounded local runs.
  environment: staging
  runMode: continuous
  randomSeed: 42
  warmup: 30s
  heartbeatInterval: 30s
  heartbeatStaleAfter: 2m
  terminationGracePeriodSeconds: 60
  maxInFlight: 200
  sendRate: "100"
  readRate: "700"
  threadShare: "0.10"
  mutationRate: "5"
  softDeleteRatio: "0.001"
  reactionRate: "100"
  reactionsPerHotMessage: "30"
  reactionMessageScope: hot_only
  reactionRemoveShare: "0.20"
  pinnedListRate: "1"
  verifyRate: "1"
  memberMutationRate: "2"
  roomMutationRate: "1"
  roomReadRate: "20"
  userReadRate: "10"
  roomCreateRate: "0.05"
  roomCreateBudget: "2000"
  roomCreateSize: "5"
  readReceiptRate: "5"
  presenceRate: "30"
  presenceConnections: "2000"
  presenceQueryShare: "0.10"
  presenceQueryBatch: "50"
  presenceSettle: 5s
  presenceTTL: 5m
  memberQuarantineMax: "10000"
  maxUsers: "20000"
  activeUsers: "2000"
  roomCount: "10000"
  channelRatio: "0.30"
  channelMembers: "100"
  largeRoomThreshold: "500"
  rateScope: site
  messagesPerActiveUserPerDay: "0"
  payloadMedianBytes: "1024"
  payloadP95Bytes: "2048"
  payloadMaxBytes: "10240"
  persistGrace: 10s
  mutationRetries: "3"
  retryMinBackoff: 100ms
  retryMaxBackoff: 5s
  recentPerRoom: "128"
  recentTotal: "200000"
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

teardown:
  # The chart refuses to render teardown unless this is explicitly true.
  approved: false
  batchRooms: "250"
  batchDelay: 100ms
  batchTimeout: 30s
  activeDeadlineSeconds: 7200
  backoffLimit: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
