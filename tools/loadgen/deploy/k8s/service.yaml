apiVersion: v1
kind: Service
metadata:
  name: cassandra-soak-loadgen
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: cassandra-soak
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "9099"
spec:
  selector:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: cassandra-soak
    loadgen.newchat/phase: soak
  ports:
    - name: metrics
      port: 9099
      targetPort: metrics
