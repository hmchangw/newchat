apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-soak-run
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/component: cassandra-soak
    loadgen.newchat/phase: soak
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/component: cassandra-soak
        loadgen.newchat/phase: soak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9099"
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: loadgen:latest
          imagePullPolicy: IfNotPresent
          args: ["soak", "--seed=42"]
          ports:
            - name: metrics
              containerPort: 9099
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cassandra-soak-loadgen-config
            - configMapRef:
                name: cassandra-soak-run
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: cassandra-soak-loadgen-secrets
                  key: nats-url
            - name: NATS_CREDS_FILE
              value: /var/run/secrets/loadgen/backend.creds
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: cassandra-soak-loadgen-secrets
                  key: mongo-uri
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cassandra-soak-loadgen-secrets
                  key: mongo-username
                  optional: true
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cassandra-soak-loadgen-secrets
                  key: mongo-password
                  optional: true
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nats-creds
              mountPath: /var/run/secrets/loadgen
              readOnly: true
      volumes:
        - name: nats-creds
          secret:
            secretName: cassandra-soak-loadgen-secrets
            items:
              - key: backend.creds
                path: backend.creds
