name: loadgen

# Thin overlay on docker-local. Backend stack (NATS, Mongo, Cassandra, Valkey,
# Elasticsearch, Keycloak) comes from docker-local/compose.deps.yaml; the
# microservices come from docker-local/compose.services.yaml. This file adds
# only the load-test-specific containers and joins the shared chat-local
# network as an external client.
#
# See deploy/Makefile for the orchestration.

services:
  loadgen:
    build:
      context: ../../..
      dockerfile: tools/loadgen/deploy/Dockerfile
    environment:
      - NATS_URL=nats://nats:4222
      - NATS_CREDS_FILE=/etc/nats/backend.creds
      - SITE_ID=site-local
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=chat
      # Normal Run A traffic reaches Cassandra only through message-worker and
      # history-service. These values are used directly only by an explicitly
      # guarded teardown with SOAK_CASSANDRA_CLEANUP=truncate.
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_KEYSPACE=${CASSANDRA_KEYSPACE:-chat}
      - MESSAGE_BUCKET_HOURS=${MESSAGE_BUCKET_HOURS:-72}
      - METRICS_ADDR=:9099
      # Worker-pool cap for concurrent publishes. Set to 0 to publish
      # serially on the ticker goroutine (legacy behavior).
      - MAX_IN_FLIGHT=200
      # Enable pprof on a separate port by uncommenting and mapping
      # the port. Off by default so the metrics endpoint doesn't expose
      # profiling.
      # - PPROF_ADDR=:6060
      - BOTTLENECK_PROM_URL=http://prometheus:9090
      # auth-service base URL for `max-rps --workload=login`. Unused by every
      # other workload, which connects to NATS with the creds file above.
      - AUTH_URL=${AUTH_URL:-http://auth-service:8080}
      # Cassandra Run A. SOAK_RUN_ID must be supplied when bringing up the
      # overlay; all remaining values use the conservative binary defaults
      # unless overridden here.
      - SOAK_RUN_ID=${SOAK_RUN_ID:-}
      - SOAK_ENVIRONMENT=${SOAK_ENVIRONMENT:-local}
      - SOAK_RUN_DURATION=${SOAK_RUN_DURATION:-72h}
      - SOAK_WARMUP=${SOAK_WARMUP:-30s}
      - SOAK_SEND_RATE=${SOAK_SEND_RATE:-100}
      - SOAK_READ_RATE=${SOAK_READ_RATE:-700}
      - SOAK_THREAD_SHARE=${SOAK_THREAD_SHARE:-0.10}
      - SOAK_MUTATION_RATE=${SOAK_MUTATION_RATE:-5}
      - SOAK_SOFT_DELETE_RATIO=${SOAK_SOFT_DELETE_RATIO:-0.001}
      - SOAK_REACTION_RATE=${SOAK_REACTION_RATE:-100}
      - SOAK_REACTIONS_PER_HOT_MESSAGE=${SOAK_REACTIONS_PER_HOT_MESSAGE:-30}
      - SOAK_REACTION_MESSAGE_SCOPE=${SOAK_REACTION_MESSAGE_SCOPE:-hot_only}
      - SOAK_REACTION_REMOVE_SHARE=${SOAK_REACTION_REMOVE_SHARE:-0.20}
      - SOAK_PINNED_LIST_RATE=${SOAK_PINNED_LIST_RATE:-1}
      - SOAK_VERIFY_RATE=${SOAK_VERIFY_RATE:-1}
      - SOAK_MEMBER_MUTATION_RATE=${SOAK_MEMBER_MUTATION_RATE:-2}
      - SOAK_ROOM_MUTATION_RATE=${SOAK_ROOM_MUTATION_RATE:-1}
      - SOAK_ROOM_READ_RATE=${SOAK_ROOM_READ_RATE:-20}
      - SOAK_ROOM_CREATE_RATE=${SOAK_ROOM_CREATE_RATE:-0.05}
      - SOAK_ROOM_CREATE_BUDGET=${SOAK_ROOM_CREATE_BUDGET:-2000}
      - SOAK_ROOM_CREATE_SIZE=${SOAK_ROOM_CREATE_SIZE:-5}
      - SOAK_READ_RECEIPT_RATE=${SOAK_READ_RECEIPT_RATE:-5}
      - SOAK_PRESENCE_RATE=${SOAK_PRESENCE_RATE:-30}
      - SOAK_PRESENCE_CONNECTIONS=${SOAK_PRESENCE_CONNECTIONS:-2000}
      - SOAK_PRESENCE_QUERY_SHARE=${SOAK_PRESENCE_QUERY_SHARE:-0.10}
      - SOAK_PRESENCE_QUERY_BATCH=${SOAK_PRESENCE_QUERY_BATCH:-50}
      - SOAK_PRESENCE_SETTLE=${SOAK_PRESENCE_SETTLE:-5s}
      - SOAK_PRESENCE_TTL=${SOAK_PRESENCE_TTL:-5m}
      - SOAK_MEMBER_QUARANTINE_MAX=${SOAK_MEMBER_QUARANTINE_MAX:-10000}
      - SOAK_MAX_USERS=${SOAK_MAX_USERS:-20000}
      - SOAK_ACTIVE_USERS=${SOAK_ACTIVE_USERS:-2000}
      - SOAK_ROOM_COUNT=${SOAK_ROOM_COUNT:-10000}
      - SOAK_CHANNEL_RATIO=${SOAK_CHANNEL_RATIO:-0.30}
      - SOAK_CHANNEL_MEMBERS=${SOAK_CHANNEL_MEMBERS:-100}
      - SOAK_RATE_SCOPE=${SOAK_RATE_SCOPE:-site}
      - SOAK_MESSAGES_PER_ACTIVE_USER_PER_DAY=${SOAK_MESSAGES_PER_ACTIVE_USER_PER_DAY:-0}
      - SOAK_PAYLOAD_MEDIAN_BYTES=${SOAK_PAYLOAD_MEDIAN_BYTES:-1024}
      - SOAK_PAYLOAD_P95_BYTES=${SOAK_PAYLOAD_P95_BYTES:-2048}
      - SOAK_PAYLOAD_MAX_BYTES=${SOAK_PAYLOAD_MAX_BYTES:-10240}
      - SOAK_PERSIST_GRACE=${SOAK_PERSIST_GRACE:-10s}
      - SOAK_MUTATION_RETRIES=${SOAK_MUTATION_RETRIES:-3}
      - SOAK_RETRY_MIN_BACKOFF=${SOAK_RETRY_MIN_BACKOFF:-100ms}
      - SOAK_RETRY_MAX_BACKOFF=${SOAK_RETRY_MAX_BACKOFF:-5s}
      - SOAK_RECENT_PER_ROOM=${SOAK_RECENT_PER_ROOM:-128}
      - SOAK_RECENT_TOTAL=${SOAK_RECENT_TOTAL:-200000}
      - SOAK_LEDGER_DIR=/var/lib/loadgen/ledger
      - SOAK_LEDGER_EPOCH=${SOAK_LEDGER_EPOCH:-v1}
      - SOAK_LEDGER_CAPACITY=${SOAK_LEDGER_CAPACITY:-200000}
      - SOAK_RECONCILE_DEADLINE=${SOAK_RECONCILE_DEADLINE:-10m}
      - SOAK_RECONCILE_RETRY_INTERVAL=${SOAK_RECONCILE_RETRY_INTERVAL:-1s}
      - SOAK_RECONCILE_READ_SHARE=${SOAK_RECONCILE_READ_SHARE:-0.5}
      - SOAK_ROOM_RECONCILE_READ_SHARE=${SOAK_ROOM_RECONCILE_READ_SHARE:-0.5}
      - SOAK_RECIPIENT_OBSERVER_ENABLED=${SOAK_RECIPIENT_OBSERVER_ENABLED:-false}
      - SOAK_RECIPIENT_OBSERVER_QUEUE=${SOAK_RECIPIENT_OBSERVER_QUEUE:-8192}
      - SOAK_RECIPIENT_OBSERVER_CONNECTIONS=${SOAK_RECIPIENT_OBSERVER_CONNECTIONS:-32}
      - SOAK_CASSANDRA_CLEANUP=${SOAK_CASSANDRA_CLEANUP:-none}
      - SOAK_CONFIRM_KEYSPACE=${SOAK_CONFIRM_KEYSPACE:-}
    volumes:
      - ../../../docker-local/backend.creds:/etc/nats/backend.creds:ro
      - loadgen-ledger:/var/lib/loadgen/ledger
    ports:
      - "9099:9099"
    entrypoint: ["sleep", "infinity"]
    networks:
      - chat-local

  room-service:
    environment:
      - MAX_ROOM_SIZE=6000

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [dashboards]
    privileged: true
    cgroup: host
    pid: host
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - chat-local

  # Polls the deps NATS server's monitoring endpoint (:8222) and re-exposes
  # JetStream state as Prometheus metrics. `-jsz=all` turns on the consumer-level
  # detail (num_pending, num_ack_pending, num_redelivered) that shows whether a
  # worker is falling behind during a run. No container_name and no host port
  # binding, so this can coexist with tools/observability's exporter.
  #
  # No healthcheck: this minimal image ships no HTTP client (no wget, no curl),
  # so the probe that used to live here could never pass and the container never
  # turned healthy — which stalled the whole dashboards profile behind
  # Prometheus's `condition: service_healthy`. Adding a client just to probe is
  # not worth it: Prometheus does not need a target up at startup, it marks an
  # unreachable one down and retries on the next scrape. Hence
  # `service_started` on the dependency below.
  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.16.0
    profiles: [dashboards]
    command: ["-port=7777", "-jsz=all", "http://chat-local-nats:8222"]
    networks:
      - chat-local

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [dashboards]
    # Local-dev only: Docker SD reads /var/run/docker.sock (root-owned) to
    # discover the :2112 SDK endpoints. Run as root so no host chmod is needed.
    # This stack already runs privileged (cAdvisor).
    user: "0:0"
    depends_on:
      cadvisor:
        condition: service_healthy
      nats-exporter:
        condition: service_started
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker SD for :2112 targets
    ports:
      - "9090:9090"
    networks:
      - chat-local

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [dashboards]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - chat-local

networks:
  chat-local:
    external: true

volumes:
  loadgen-ledger:
