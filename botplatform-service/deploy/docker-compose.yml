name: botplatform-service

services:
  botplatform-service:
    build:
      context: ../..
      dockerfile: botplatform-service/deploy/Dockerfile
    pull_policy: build
    # No host port and no Traefik route: the only caller is portal-service,
    # forwarding /api/v1/login in-network via BOTPLATFORM_URL.
    environment:
      - OTEL_SERVICE_NAME=botplatform-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - PORT=8080
      - SITE_ID=site-local
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=chat
      - SESSIONS_MAX_PER_ACCOUNT=100
      - BCRYPT_COST=10
      - DEV_MODE=true
    networks:
      - chat-local

networks:
  chat-local:
    external: true
