name: botplatform-service

services:
  botplatform-service:
    build:
      context: ../..
      dockerfile: botplatform-service/deploy/Dockerfile
    pull_policy: build
    # No host port and no Traefik route: the only caller is portal-service,
    # forwarding /api/v1/login in-network via BOTPLATFORM_URL.
    environment:
      - OTEL_SERVICE_NAME=botplatform-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - PORT=8080
      - SITE_ID=${SITE_ID:-site-local}
      # NATS_URL is `required` in config.go — without it the service exits at
      # startup and portal's /api/v1/login forward gets a 502.
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-primaryPreferred}
      - MONGO_DB=${MONGO_DB:-chat}
      - SESSIONS_MAX_PER_ACCOUNT=${SESSIONS_MAX_PER_ACCOUNT:-100}
      # Keeps already-authenticated bots working while Mongo is unreachable.
      # Requires VALKEY_ADDRS; 0 disables the tier.
      - SESSION_CACHE_TTL=${SESSION_CACHE_TTL:-90m}
      - MONGO_SERVER_SELECTION_TIMEOUT=${MONGO_SERVER_SELECTION_TIMEOUT:-2s}
      - BCRYPT_COST=${BCRYPT_COST:-10}
      # Admission caps. MAX_CONCURRENCY guards /api/v1/login (bcrypt before the
      # password is known good); BOT_MAX_CONCURRENCY guards the bot routes,
      # where requireBot's session lookup misses a positive-only cache on every
      # invalid token and reaches MongoDB. Overflow is shed 429 + Retry-After,
      # never queued. Raise BOT_MAX_CONCURRENCY if BOT_RATE_LIMIT_GLOBAL_PER_MIN
      # is raised well above its default or set to 0, or where Valkey is absent
      # — in those deployments this is the only ceiling on bot traffic.
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-32}
      - BOT_MAX_CONCURRENCY=${BOT_MAX_CONCURRENCY:-32}
      - DEV_MODE=${DEV_MODE:-true}
    volumes:
      - ../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
