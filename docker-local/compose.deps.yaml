name: chat-local-deps

# Shared third-party dependencies for local dev. Owns the chat-local network
# that every microservice compose joins as external.
#
# Start:  make deps-up      (detached, waits for healthchecks)
# Stop:   make deps-down

services:
  nats:
    image: nats:2.11-alpine
    container_name: chat-local-nats
    ports:
      - "4222:4222"
      - "8222:8222"
      - "9222:9222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data/jetstream
    command: ["-c", "/etc/nats/nats.conf"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - chat-local

  mongodb:
    # Patch-pinned to match pkg/testutil/testimages/testimages.go so local dev
    # tracks the same image testcontainers uses.
    image: mongo:8.2.9
    container_name: chat-local-mongodb
    # Single-node replica set — transactions (admin-service password-change,
    # deactivate, and the new permission-grant batch insert) require one; a
    # standalone mongod rejects them outright. The member host below is the
    # in-network service name "mongodb", so container-side clients need no
    # config change; host-side tools (make seed, tools/jaeger/README.md) add
    # ?directConnection=true instead of trying to resolve that name.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      # No initdb.d hook — it only runs on first volume creation, so
      # chat.hr_employee went stale. `make seed` owns that collection now.
      - mongo-data:/data/db
    healthcheck:
      # The rs.status()/rs.initiate() pair only bootstraps the set; the trailing
      # quit() is what decides health — without it every branch exits 0 and
      # depends_on: service_healthy would release before a primary was elected.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }
          quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 15
    networks:
      - chat-local

  cassandra:
    image: cassandra:5
    container_name: chat-local-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=chat-dev
      # Cap heap so the local stack fits in 8GB Docker; default ~2GB OOMs.
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    # 1GB OOMs mid-init — JVM off-heap pushes total to ~1.5× heap.
    mem_limit: 1500m
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-local

  # Schema bootstrap. One-shot: runs every *.cql under docker-local/cassandra/init
  # in sorted order (01-, 02-, …) and exits 0. Lives in the "init" profile so
  # `docker compose up --wait` (used by `make deps-up`) ignores it — see
  # https://github.com/docker/compose/issues/10596. The Makefile runs it
  # explicitly with `docker compose --profile init run --rm cassandra-init`.
  cassandra-init:
    image: cassandra:5
    container_name: chat-local-cassandra-init
    profiles: ["init"]
    depends_on:
      cassandra:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./cassandra/init:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        shopt -s nullglob
        for f in /init/*.cql; do
          echo "==> applying $$f"
          cqlsh cassandra -f "$$f"
        done
        echo "Schema initialized successfully"
    networks:
      - chat-local

  # Browse the Cassandra data at http://localhost:8083 — keyspaces, tables,
  # schema, row browser and a CQL Query page. Nothing seeds these tables, so on
  # a fresh stack they are empty until messages flow through the services.
  #
  # `chat.pinned_messages_by_room` is the message table to open first in the row
  # browser: it has no reactions column, so it lists normally.
  #
  # KNOWN LIMITATION — the *row browser* cannot list chat.messages_by_room,
  # chat.messages_by_id or chat.thread_messages_by_thread. Those carry
  # `reactions MAP<FROZEN<reaction_key>, FROZEN<reactor_info>>`, and gocql's
  # untyped row API (Iter.SliceMap, which any generic browser must use) builds
  # the Go map type with reflect.MapOf — a UDT decodes to map[string]interface{},
  # which is not a valid Go map key, so the request panics and the table renders
  # empty with no error — indistinguishable from a genuinely empty table, so
  # never read it as "Cassandra has no messages". This is not a version lag: it
  # reproduces identically on
  # gocql v1.7.0 (the version this repo pins) and on the newest
  # apache/cassandra-gocql-driver v2.1.2, so no driver bump fixes it.
  #
  # The Query page reads those tables fine, reactions included, by asking
  # Cassandra to serialize server-side so the driver only ever sees TEXT:
  #   SELECT JSON * FROM chat.messages_by_room WHERE room_id='r-general' AND bucket=...;
  #   SELECT message_id, msg, toJson(reactions) FROM chat.messages_by_id LIMIT 20;
  # Only a bare `SELECT reactions`/`SELECT *` hits the panic.
  #
  # Message bodies do not arrive readable: ATREST_ENABLED defaults to true, so
  # message-worker puts the body in enc_payload as ciphertext and leaves msg
  # NULL. See the README's "Messages reach Cassandra encrypted".
  #
  # READ_ONLY is off by default: the build rejects *every* Query-page statement
  # when it is on, plain SELECTs included, which would disable the one path that
  # reads these tables. Set CASSANDRA_WEB_READ_ONLY=true in docker-local/.env to
  # keep the UI's truncate/import/delete buttons from reaching real data, at the
  # cost of the Query page. Against a cluster with auth, a SELECT-only role is
  # the better lock: Cassandra refuses the write and the Query page keeps
  # working. See the README's "Connecting to a Cassandra that needs auth".
  cassandra-web:
    image: ipushc/cassandra-web:v1.1.6
    container_name: chat-local-cassandra-web
    # Bound to 127.0.0.1, following the same rule the obs stack uses for its
    # dev-only UIs. Upstream's last release is Aug 2024, built on Go 1.20.2;
    # `govulncheck -mode=binary` reports 59 reachable stdlib advisories in it,
    # mostly DoS-class in net/http and html/template. Fine for a viewer only
    # the developer can reach, not something to expose on a shared network.
    ports:
      - "127.0.0.1:${CASSANDRA_WEB_HOST_PORT:-8083}:8083"
    environment:
      # Browser-specific endpoint, defaulting to the container above. Pointing
      # the Go services at another cluster via CASSANDRA_HOSTS would otherwise
      # leave the viewer reading the local one and showing stale or empty state
      # with no error. CASSANDRA_HOSTS is a comma-separated host:port list and
      # this image takes a single host plus port, so it gets its own pair
      # rather than a parse of that one.
      - CASSANDRA_HOST=${CASSANDRA_WEB_HOST:-cassandra}
      - CASSANDRA_PORT=${CASSANDRA_WEB_PORT:-9042}
      - HOST_PORT=:8083
      # Dedicated credentials, falling back to the service-wide pair. They are
      # separate because the roles differ: the browser wants SELECT only, while
      # message-worker and the other writers need MODIFY. Sharing one pair
      # forces a choice between a write-capable browser and a stack that cannot
      # write. Empty is correct for the local Cassandra, which runs
      # AllowAllAuthenticator; against an authenticating cluster the container
      # exits 1 at startup with "authentication required" rather than serving a
      # broken UI.
      - CASSANDRA_USERNAME=${CASSANDRA_WEB_USERNAME:-${CASSANDRA_USERNAME:-}}
      - CASSANDRA_PASSWORD=${CASSANDRA_WEB_PASSWORD:-${CASSANDRA_PASSWORD:-}}
      - READ_ONLY=${CASSANDRA_WEB_READ_ONLY:-false}
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/keyspace >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - chat-local

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: chat-local-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chat-local

  # Kibana is a dev-only convenience for browsing ES indexes at
  # http://localhost:5601. It's heavy (~1GB RAM) and OOMs first under memory
  # pressure, so it's behind the "debug" profile — `make deps-up` skips it.
  # Bring up with: docker compose -f docker-local/compose.deps.yaml --profile debug up -d kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: chat-local-kibana
    profiles: ["debug"]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      elasticsearch:
        condition: service_healthy
    # `kibana:8.17.0` ships /usr/bin/curl but not wget. `start_period: 60s`
    # covers Kibana's 30-60s boot before the first /api/status succeeds so
    # the 10 retries don't exhaust early.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - chat-local

  # Valkey backs the per-user restricted-rooms cache in search-service (5-min
  # TTL, lazy-populated from Elasticsearch on miss) and room key pairs for
  # encryption. Persistence is disabled: the cache is derivative of the
  # authoritative user-room ES doc and survives restart only through the
  # lazy-populate path.
  # Single-node cluster-mode: the entrypoint starts valkey-server with
  # --cluster-enabled, waits for it to accept connections, then assigns all
  # 16384 hash slots so it forms a valid one-node cluster.
  # --cluster-announce-hostname + --cluster-preferred-endpoint-type=hostname
  # make CLUSTER SLOTS return "valkey" instead of the default 127.0.0.1, so
  # sibling containers on chat-local don't redirect to their own loopback.
  valkey:
    # Patch-pinned (same rationale as mongodb above).
    image: valkey/valkey:8.1.7-alpine
    container_name: chat-local-valkey
    ports:
      - "6379:6379"
    entrypoint:
      - sh
      - -c
      - |
        valkey-server --cluster-enabled yes --cluster-config-file /tmp/nodes.conf --cluster-node-timeout 5000 --cluster-announce-hostname valkey --cluster-preferred-endpoint-type hostname --save '' --appendonly no &
        until valkey-cli ping > /dev/null 2>&1; do sleep 0.1; done
        if ! valkey-cli CLUSTER INFO | grep -q 'cluster_slots_assigned:16384'; then
          valkey-cli CLUSTER ADDSLOTSRANGE 0 16383
        fi
        wait
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli CLUSTER INFO | grep 'cluster_state:ok'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chat-local

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: chat-local-keycloak
    # Host 8180 chosen because 9090 collides with search-service's Prometheus
    # metrics port. Browse the admin UI at http://localhost:8180.
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Keycloak 26 serves /health/ready on the dedicated management port (9000)
      # and the endpoint is opt-in.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../auth-service/deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: >
        sh -c 'exec 3<>/dev/tcp/localhost/9000 &&
        echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
        cat <&3 | grep -q "200"'
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - chat-local

  vault:
    image: hashicorp/vault:1.18
    container_name: chat-local-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-only-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chat-local

  # One-shot transit setup. Same `init` profile as cassandra-init so
  # `docker compose up --wait` skips it; the Makefile runs it explicitly
  # after deps come up.
  vault-init:
    image: hashicorp/vault:1.18
    container_name: chat-local-vault-init
    profiles: ["init"]
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-only-token
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        vault secrets enable -path=transit transit || true
        vault write -f transit/keys/chat-kek
    networks:
      - chat-local

  # Local-dev only: Vault dev mode is in-memory, while MongoDB persists across
  # Docker Desktop restarts. When Vault recreates the transit key, previously
  # wrapped room DEKs can no longer be unwrapped, so reset the derivative DEK
  # cache and let services lazily recreate entries under the fresh key.
  vault-dek-reset:
    # DESTRUCTIVE: wipes every room_data_keys doc so services re-provision DEKs
    # after a Vault reset. Opt-in only — never runs on a plain `deps-up`; enable
    # with `docker compose -f docker-local/compose.deps.yaml --profile dek-reset
    # run --rm vault-dek-reset`.
    profiles: ["dek-reset"]
    image: mongo:8.2.9
    container_name: chat-local-vault-dek-reset
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongodb:27017/chat", "--quiet", "--eval"]
    command:
      - |
        const result = db.getCollection('room_data_keys').deleteMany({});
        printjson({ roomDataKeysDeleted: result.deletedCount });
    networks:
      - chat-local

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    container_name: chat-local-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - chat-local

volumes:
  nats-data:
  mongo-data:
  cassandra-data:
  es-data:
  minio-data:

networks:
  chat-local:
    name: chat-local
