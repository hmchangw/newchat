name: bot-notification-worker

services:
  bot-notification-worker:
    build:
      context: ../../..
      dockerfile: notification-worker/deploy/bot/Dockerfile
    environment:
      - OTEL_SERVICE_NAME=bot-notification-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - SITE_ID=${SITE_ID:-site-local}
      - MODE=bot
      # Dev-only pprof profiling on the health port (off by default). Flip on
      # stack-wide for a profiling session with `PPROF_ENABLED=true make up`.
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_DB=${MONGO_DB:-chat}
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
      - VALKEY_ADDRS=${VALKEY_ADDRS:-valkey:6379}
      - ROOMSUBCACHE_TTL=${ROOMSUBCACHE_TTL:-5m}
      - LARGE_ROOM_THRESHOLD=${LARGE_ROOM_THRESHOLD:-500}
      # Recipients per BOT-PUSH-NOTIFICATION event. Default 100; well under FCM's 500-token
      # multicast cap and APNs HTTP/2 connection-frame ceiling.
      - PUSH_RECIPIENT_BATCH_SIZE=${PUSH_RECIPIENT_BATCH_SIZE:-100}
      - ROOM_META_CACHE_SIZE=${ROOM_META_CACHE_SIZE:-10000}
      - ROOM_META_CACHE_TTL=${ROOM_META_CACHE_TTL:-2m}
      - PRESENCE_RPC_ENABLED=${PRESENCE_RPC_ENABLED:-false}
      # Must match the broker's max_payload. Emitter rejects batches larger
      # than this before publish so the failure surfaces with a clear error
      # instead of a NATS NACK.
      - NATS_MAX_PAYLOAD_BYTES=${NATS_MAX_PAYLOAD_BYTES:-262144}
      # BOT-MESSAGES-CANONICAL owned by bot-message-handler; BOT-PUSH-NOTIFICATION is ops/IaC-owned.
      # true like the user variants — false means verify-and-exit, and the bot
      # streams' creator (bot-message-handler) is not in compose.services.yaml.
      - BOOTSTRAP_STREAMS=${BOOTSTRAP_STREAMS:-true}
    volumes:
      - ../../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
