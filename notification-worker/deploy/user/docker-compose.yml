name: notification-worker

services:
  notification-worker:
    build:
      context: ../../..
      dockerfile: notification-worker/deploy/user/Dockerfile
    environment:
      - OTEL_SERVICE_NAME=notification-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NATS_URL=${NATS_URL:-nats://nats:4222}
      - NATS_CREDS_FILE=${NATS_CREDS_FILE:-/etc/nats/backend.creds}
      - SITE_ID=${SITE_ID:-site-local}
      - MODE=user
      # Dev-only pprof profiling on the health port (off by default). Flip on
      # stack-wide for a profiling session with `PPROF_ENABLED=true make up`.
      - PPROF_ENABLED=${PPROF_ENABLED:-false}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017}
      - MONGO_USER_READ_PREFERENCE=${MONGO_USER_READ_PREFERENCE:-primaryPreferred}
      - MONGO_DB=${MONGO_DB:-chat}
      # Read preference; secondaryPreferred offloads the primary, no-op without a replica set.
      - MONGO_READ_PREFERENCE=${MONGO_READ_PREFERENCE:-secondaryPreferred}
      - VALKEY_ADDRS=${VALKEY_ADDRS:-valkey:6379}
      - ROOMSUBCACHE_TTL=${ROOMSUBCACHE_TTL:-5m}
      - LARGE_ROOM_THRESHOLD=${LARGE_ROOM_THRESHOLD:-500}
      # Recipients per PUSH-NOTIFICATION event. Default 100; well under FCM's 500-token
      # multicast cap and APNs HTTP/2 connection-frame ceiling.
      - PUSH_RECIPIENT_BATCH_SIZE=${PUSH_RECIPIENT_BATCH_SIZE:-100}
      # Title is resolved here from the rooms collection; sender display name is
      # pre-composed by message-gatekeeper and propagated on the canonical message.
      # The users collection IS read, but only for notification settings: an
      # indexed $in per 512-account chunk over the already-narrowed candidate
      # set — one query for almost every room — never a per-recipient lookup and
      # never on the sender-name path.
      - ROOM_META_CACHE_SIZE=${ROOM_META_CACHE_SIZE:-10000}
      - ROOM_META_CACHE_TTL=${ROOM_META_CACHE_TTL:-2m}
      - PRESENCE_RPC_ENABLED=${PRESENCE_RPC_ENABLED:-false}
      - BADGE_COUNT_RPC_ENABLED=${BADGE_COUNT_RPC_ENABLED:-true}
      # Enforces muteAllNotifications / alwaysAllowPriorityNotifications /
      # showNotificationsInCall. Kill switch: false reverts to pre-enforcement
      # delivery without rolling back the binary.
      - USER_SETTINGS_ENABLED=${USER_SETTINGS_ENABLED:-true}
      - USER_SETTINGS_BATCH_SIZE=${USER_SETTINGS_BATCH_SIZE:-512}
      - USER_SETTINGS_TIMEOUT=${USER_SETTINGS_TIMEOUT:-2s}
      - USER_CACHE_SIZE=${USER_CACHE_SIZE:-10000}
      - USER_CACHE_TTL=${USER_CACHE_TTL:-5m}
      - MENTION_NAMES_ENABLED=${MENTION_NAMES_ENABLED:-true}
      - MENTION_NAMES_TIMEOUT=${MENTION_NAMES_TIMEOUT:-2s}
      - BOOTSTRAP_STREAMS=${BOOTSTRAP_STREAMS:-true}
    volumes:
      - ../../../docker-local/backend.creds:${NATS_CREDS_FILE:-/etc/nats/backend.creds}:ro
    networks:
      - chat-local

networks:
  chat-local:
    external: true
